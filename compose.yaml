name: sourcehut

x-srht-app: &srht-app
  image: sourcehut/platform:local
  build:
    context: .
    dockerfile: Dockerfile
    target: platform
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
  environment:
    SRHT_USER: root
  volumes:
    - ./config.ini:/run/secrets/config.ini:ro
    - ./pgp:/run/secrets/pgp:ro
  depends_on:
    postgres:
      condition: service_healthy
    redict:
      condition: service_healthy
    silo-init:
      condition: service_completed_successfully
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: srht_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/bootstrap.py first}
      POSTGRES_DB: postgres
      DB_META_PASSWORD: ${DB_META_PASSWORD:?Run scripts/bootstrap.py first}
      DB_GIT_PASSWORD: ${DB_GIT_PASSWORD:?Run scripts/bootstrap.py first}
      DB_HG_PASSWORD: ${DB_HG_PASSWORD:?Run scripts/bootstrap.py first}
      DB_TODO_PASSWORD: ${DB_TODO_PASSWORD:?Run scripts/bootstrap.py first}
      DB_MAN_PASSWORD: ${DB_MAN_PASSWORD:?Run scripts/bootstrap.py first}
      DB_PASTE_PASSWORD: ${DB_PASTE_PASSWORD:?Run scripts/bootstrap.py first}
      DB_PAGES_PASSWORD: ${DB_PAGES_PASSWORD:?Run scripts/bootstrap.py first}
      DB_HUB_PASSWORD: ${DB_HUB_PASSWORD:?Run scripts/bootstrap.py first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/init-postgres.sh:/docker-entrypoint-initdb.d/10-sourcehut.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srht_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    stop_grace_period: 1m

  redict:
    image: registry.redict.io/redict:7.3.6
    restart: unless-stopped
    environment:
      REDICT_PASSWORD: ${REDICT_PASSWORD:?Run scripts/bootstrap.py first}
    command:
      - /bin/redict-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDICT_PASSWORD:?Run scripts/bootstrap.py first}
      - --maxmemory-policy
      - noeviction
    volumes:
      - redict-data:/data
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(REDICTCLI_AUTH=$$REDICT_PASSWORD /bin/redict-cli ping)\" = PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  silo:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Run scripts/bootstrap.py first}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Run scripts/bootstrap.py first}
    volumes:
      - silo-data:/data
    command: ["server", "/data", "--console-address", ":9001"]

  silo-init:
    image: pgsty/mc:RELEASE.2026-10-26T00-00-00Z
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Run scripts/bootstrap.py first}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Run scripts/bootstrap.py first}
    depends_on:
      - silo
    command:
      - |
        for attempt in $$(seq 1 60); do
          if mc alias set local http://silo:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" >/dev/null 2>&1 && mc ready local; then
            mc mb --ignore-existing local/sourcehut
            exit 0
          fi
          sleep 2
        done
        echo 'S3 storage did not become ready' >&2
        exit 1

  migrate:
    <<: *srht-app
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        for service in meta.sr.ht git.sr.ht hg.sr.ht todo.sr.ht man.sr.ht paste.sr.ht pages.sr.ht hub.sr.ht; do
          echo "Migrating $$service"
          dsn=$$(awk -v section="$$service" '$$0 == "[" section "]" { in_section = 1; next } /^\[/ { in_section = 0 } in_section && /^connection-string=/ { sub(/^[^=]*=/, ""); print; exit }' /etc/sr.ht/config.ini)
          initialized=$$(psql "$$dsn" -Atqc "SELECT to_regclass('public.brant_db_version') IS NOT NULL")
          if [ "$$initialized" = t ]; then
            sourcehut-migrate "$$service" up
          else
            sourcehut-migrate "$$service" init
            sourcehut-migrate "$$service" up
          fi
        done

  volume-init:
    <<: *srht-app
    restart: "no"
    depends_on: []
    volumes:
      - ./config.ini:/run/secrets/config.ini:ro
      - ./pgp:/run/secrets/pgp:ro
      - git-repos:/var/lib/git
      - hg-repos:/var/lib/mercurial
      - pages-certs:/var/lib/pages/certs
    command:
      - /bin/sh
      - -ec
      - |
        chown -R git:git /var/lib/git
        chown -R hg:hg /var/lib/mercurial
        chown -R pages:pages /var/lib/pages/certs

  meta-api:
    <<: *srht-app
    environment:
      SRHT_USER: meta
    command: ["/usr/bin/meta.sr.ht-api", "-b", "0.0.0.0:5100"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "5100"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s

  meta:
    <<: *srht-app
    environment:
      SRHT_USER: meta
    command:
      - gunicorn
      - metasrht.app:app
      - --bind
      - 0.0.0.0:5000
      - --config
      - /etc/sr.ht/meta.sr.ht.gunicorn.conf.py
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
    depends_on:
      meta-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redict:
        condition: service_healthy
      silo-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "5000"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s

  meta-webhooks:
    <<: *srht-app
    environment:
      SRHT_USER: meta
    command: ["celery", "-A", "metasrht.webhooks", "worker", "--loglevel=INFO", "--concurrency=2"]

  git-api:
    <<: *srht-app
    environment:
      SRHT_USER: git
    volumes:
      - ./config.ini:/run/secrets/config.ini:ro
      - ./pgp:/run/secrets/pgp:ro
      - git-repos:/var/lib/git
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redict:
        condition: service_healthy
      silo-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    command: ["/usr/bin/git.sr.ht-api", "-b", "0.0.0.0:5101"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "5101"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s

  git:
    <<: *srht-app
    environment:
      SRHT_USER: git
    volumes:
      - ./config.ini:/run/secrets/config.ini:ro
      - ./pgp:/run/secrets/pgp:ro
      - git-repos:/var/lib/git
    depends_on:
      git-api:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redict:
        condition: service_healthy
      silo-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    command:
      - gunicorn
      - gitsrht.app:app
      - --bind
      - 0.0.0.0:5001
      - --config
      - /etc/sr.ht/git.sr.ht.gunicorn.conf.py
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "5001"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s

  git-http:
    <<: *srht-app
    environment:
      SRHT_USER: git
    depends_on:
      volume-init:
        condition: service_completed_successfully
    volumes:
      - ./config.ini:/run/secrets/config.ini:ro
      - ./pgp:/run/secrets/pgp:ro
      - git-repos:/var/lib/git:ro
    command: ["spawn-fcgi", "-n", "-a", "0.0.0.0", "-p", "9000", "--", "/usr/bin/fcgiwrap"]

  hg-api:
    <<: *srht-app
    environment:
      SRHT_USER: hg
    volumes:
      - ./config.ini:/run/secrets/config.ini:ro
      - ./pgp:/run/secrets/pgp:ro
      - hg-repos:/var/lib/mercurial
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redict:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["/usr/bin/hg.sr.ht-api", "-b", "0.0.0.0:5110"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "5110"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s

  hg:
    <<: *srht-app
    environment:
      SRHT_USER: hg
    volumes:
      - ./config.ini:/run/secrets/config.ini:ro
      - ./pgp:/run/secrets/pgp:ro
      - hg-repos:/var/lib/mercurial
    depends_on:
      hg-api:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redict:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command:
      - gunicorn
      - hgsrht.app:app
      - --bind
      - 0.0.0.0:5010
      - --config
      - /etc/sr.ht/hg.sr.ht.gunicorn.conf.py
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "5010"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s

  todo-api:
    <<: *srht-app
    environment:
      SRHT_USER: todo
    command: ["/usr/bin/todo.sr.ht-api", "-b", "0.0.0.0:5103"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "5103"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s

  todo:
    <<: *srht-app
    environment:
      SRHT_USER: todo
    command:
      - gunicorn
      - todosrht.app:app
      - --bind
      - 0.0.0.0:5003
      - --config
      - /etc/sr.ht/todo.sr.ht.gunicorn.conf.py
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
    depends_on:
      todo-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redict:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "5003"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s

  man-api:
    <<: *srht-app
    environment:
      SRHT_USER: man
    command: ["/usr/bin/man.sr.ht-api", "-b", "0.0.0.0:5104"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "5104"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s

  man:
    <<: *srht-app
    environment:
      SRHT_USER: man
    command:
      - gunicorn
      - mansrht.app:app
      - --bind
      - 0.0.0.0:5004
      - --config
      - /etc/sr.ht/man.sr.ht.gunicorn.conf.py
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
    depends_on:
      man-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redict:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "5004"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s

  paste-api:
    <<: *srht-app
    environment:
      SRHT_USER: paste
    command: ["/usr/bin/paste.sr.ht-api", "-b", "0.0.0.0:5111"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "5111"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s

  paste:
    <<: *srht-app
    environment:
      SRHT_USER: paste
    command:
      - gunicorn
      - pastesrht.app:app
      - --bind
      - 0.0.0.0:5011
      - --config
      - /etc/sr.ht/paste.sr.ht.gunicorn.conf.py
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
    depends_on:
      paste-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redict:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "5011"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s

  pages:
    <<: *srht-app
    environment:
      SRHT_USER: pages
    volumes:
      - ./config.ini:/run/secrets/config.ini:ro
      - ./pgp:/run/secrets/pgp:ro
      - pages-certs:/var/lib/pages/certs
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redict:
        condition: service_healthy
      silo-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    command: ["/usr/bin/pages.sr.ht", "-b", "0.0.0.0:5112"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "5112"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s

  hub:
    <<: *srht-app
    environment:
      SRHT_USER: hub
    command:
      - gunicorn
      - hubsrht.app:app
      - --bind
      - 0.0.0.0:5014
      - --config
      - /etc/sr.ht/hub.sr.ht.gunicorn.conf.py
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
    depends_on:
      hub-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redict:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "5014"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s

  hub-api:
    <<: *srht-app
    environment:
      SRHT_USER: hub
    command: ["/usr/bin/hub.sr.ht-api", "-b", "0.0.0.0:5114"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "5114"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s

  ssh:
    <<: *srht-app
    environment:
      SRHT_USER: root
      SRHT_CONFIG_GROUP: srht-shell
    restart: unless-stopped
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - SYS_CHROOT
      - AUDIT_WRITE
    ports:
      - "${SSH_PORT:-22}:22"
    volumes:
      - ./config.ssh.ini:/run/secrets/config.ini:ro
      - ./pgp:/run/secrets/pgp:ro
      - git-repos:/var/lib/git
      - hg-repos:/var/lib/mercurial
      - ssh-hostkeys:/var/lib/sourcehut/ssh
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redict:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /run/sshd /var/lib/sourcehut/ssh /var/log/hg.sr.ht
        chown hg:hg /var/log/hg.sr.ht
        sed -i '/^hg:/s#/sbin/nologin$#/bin/sh#' /etc/passwd
        for key in rsa ed25519; do
          if [ ! -s "/var/lib/sourcehut/ssh/ssh_host_$${key}_key" ]; then
            ssh-keygen -q -t "$$key" -N '' -f "/var/lib/sourcehut/ssh/ssh_host_$${key}_key"
          fi
        done
        passwd -u git >/dev/null 2>&1 || true
        passwd -u hg >/dev/null 2>&1 || true
        exec /usr/sbin/sshd -D -e -f /etc/ssh/sshd_config

  scheduler:
    <<: *srht-app
    environment:
      SRHT_USER: root
      SRHT_CONFIG_MODE: "0444"
    volumes:
      - ./config.ini:/run/secrets/config.ini:ro
      - git-repos:/var/lib/git
      - hg-repos:/var/lib/mercurial
    depends_on:
      volume-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    command: ["/usr/sbin/crond", "-f", "-d", "8"]

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/proxy_params:/etc/nginx/proxy_params:ro
      - git-repos:/var/lib/git:ro
      - hg-repos:/var/lib/mercurial:ro
    depends_on:
      meta:
        condition: service_healthy
      git:
        condition: service_healthy
      hg:
        condition: service_healthy
      todo:
        condition: service_healthy
      man:
        condition: service_healthy
      paste:
        condition: service_healthy
      pages:
        condition: service_healthy
      hub:
        condition: service_healthy
      git-http:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.27.8
    profiles: [dev-mail]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
  redict-data:
  silo-data:
  git-repos:
  hg-repos:
  pages-certs:
  ssh-hostkeys:
